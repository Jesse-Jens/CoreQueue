<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - CoreQueue</title>
  <style>
    :root { --bg:#1e1e2f; --bg-light:#2a2a3e; --text:#e0e0fa; --accent:#1E90FF; --input-bg:#2a2a3e; --input-border:#3a3a4e; }
    body.light{--bg:#f2f2f2;--bg-light:#fff;--text:#1e1e2f;--input-bg:#fff;--input-border:#ccc;}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
    body{display:flex;background:var(--bg);color:var(--text);min-height:100vh;}
    aside.sidebar{width:240px;background:var(--bg-light);display:flex;flex-direction:column;justify-content:space-between;padding:1rem;}
    .top-nav h2{color:var(--accent);font-size:1.25rem;text-align:center;margin-bottom:1rem;}
    nav.nav-links a{display:block;color:var(--text);text-decoration:none;padding:0.75rem 1rem;border-radius:4px;margin-bottom:0.5rem;font-size:0.95rem;transition:background .2s;}
    nav.nav-links a.active, nav.nav-links a:hover{background:var(--accent);color:#fff;}
    .settings-group a{display:block;color:var(--text);text-decoration:none;padding:.5rem 1rem;border-radius:4px;margin-bottom:.5rem;font-size:.9rem;transition:color .2s;}
    .settings-group a:hover{color:var(--accent);}
    main.main{flex:1;padding:2rem;}
    .tabs{display:flex;border-bottom:1px solid var(--input-border);margin-bottom:1rem;}
    .tabs button{background:none;border:none;padding:.75rem 1.5rem;color:var(--text);cursor:pointer;transition:color .2s;font-size:1rem;}
    .tabs button.active{border-bottom:3px solid var(--accent);color:#fff;}
    .section{display:none;} .section.active{display:block;}
    .form-group{margin-bottom:1rem;}
    label{display:block;font-size:.9rem;margin-bottom:.5rem;}
    input,select{width:100%;padding:.5rem;background:var(--input-bg);border:1px solid var(--input-border);border-radius:4px;color:var(--text);font-size:1rem;}
    .btn{background:var(--accent);color:#fff;border:none;padding:.5rem 1rem;border-radius:4px;cursor:pointer;transition:background .2s;font-size:.95rem;}
    .btn:hover{background:#4F8CFF;}
    .section-content{background:var(--bg-light);padding:1rem;border-radius:6px;}
    fieldset{border:1px solid var(--input-border);padding:1rem;border-radius:4px;margin-top:1rem;}
    legend{padding:0 .5rem;font-weight:bold;}
    .hidden{display:none;}
    @media(max-width:768px){body{flex-direction:column;}aside.sidebar{width:100%;flex-direction:row;justify-content:space-around;padding:.5rem;}main.main{padding:1rem;} .tabs{flex-wrap:wrap;}}
  </style>
</head>
<body>
  <aside class="sidebar">
    <div>
      <div class="top-nav">
        <h2>CoreQueue</h2>
        <nav class="nav-links">
          <a href="/Dashboard/dashboard">Dashboard</a>
          <a href="/inventory">Inventory</a>
          <a href="/Organisations/organisations">Organisations</a>
        </nav>
      </div>
    </div>
    <div class="settings-group">
      <a href="/settings" class="active">Settings</a>
      <a href="#" onclick="signOut()">Sign Out</a>
    </div>
  </aside>
  <main class="main">
    <h1>Settings</h1>
    <div class="tabs">
      <button class="active" data-tab="profile">Profile</button>
      <button data-tab="system">System</button>
    </div>
    <section id="profile" class="section active">
      <div class="section-content">
        <div class="form-group">
          <label for="displayName">Display Name</label>
          <input type="text" id="displayName" placeholder="Your name">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="New password">
        </div>
        <div class="form-group">
          <label for="darkmode">Dark Mode</label>
          <select id="darkmode">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
        <button class="btn">Save Profile</button>
      </div>
    </section>
    <section id="system" class="section">
      <div class="section-content">
        <div class="form-group">
          <label for="timezone">Timezone</label>
          <select id="timezone">
            <option>Europe/Amsterdam</option>
            <option>UTC</option>
            <!-- more tz options -->
          </select>
        </div>
        <div class="form-group">
          <label for="currency">Currency</label>
          <select id="currency">
            <option>EUR</option>
            <option>USD</option>
            <!-- more currencies -->
          </select>
        </div>
        <div class="form-group">
          <label for="mailService">Mail Service</label>
          <select id="mailService">
            <option value="smtp">SMTP</option>
            <option value="gmail">Google SMTP</option>
            <option value="exchange">Exchange</option>
            <option value="office365">Office365</option>
            <option value="sendgrid">SendGrid</option>
            <option value="mailgun">Mailgun</option>
          </select>
        </div>
        <fieldset id="smtpSettings">
          <legend>SMTP Settings</legend>
          <div class="form-group"><label>Host</label><input type="text" placeholder="smtp.example.com"></div>
          <div class="form-group"><label>Port</label><input type="number" value="587"></div>
          <div class="form-group"><label>Username</label><input type="text" placeholder="user"></div>
          <div class="form-group"><label>Password</label><input type="password" placeholder="password"></div>
        </fieldset>
        <fieldset id="gmailSettings" class="hidden">
          <legend>Google SMTP</legend>
          <div class="form-group"><label>Client ID</label><input type="text" placeholder="Client ID"></div>
          <div class="form-group"><label>Client Secret</label><input type="password" placeholder="Client Secret"></div>
          <div class="form-group"><label>Refresh Token</label><input type="text" placeholder="Refresh Token"></div>
        </fieldset>
        <fieldset id="exchangeSettings" class="hidden">
          <legend>Exchange App</legend>
          <div class="form-group"><label>App ID</label><input type="text" placeholder="GUID"></div>
          <div class="form-group"><label>App Secret</label><input type="password" placeholder="secret"></div>
        </fieldset>
        <fieldset id="office365Settings" class="hidden">
          <legend>Office365</legend>
          <div class="form-group"><label>Tenant ID</label><input type="text" placeholder="Tenant GUID"></div>
          <div class="form-group"><label>Client ID</label><input type="text" placeholder="Client GUID"></div>
          <div class="form-group"><label>Client Secret</label><input type="password" placeholder="secret"></div>
        </fieldset>
        <fieldset id="sendgridSettings" class="hidden">
          <legend>SendGrid API</legend>
          <div class="form-group"><label>API Key</label><input type="password" placeholder="SG.xxx"></div>
        </fieldset>
        <fieldset id="mailgunSettings" class="hidden">
          <legend>Mailgun API</legend>
          <div class="form-group"><label>API Key</label><input type="password" placeholder="key-xxx"></div>
          <div class="form-group"><label>Domain</label><input type="text" placeholder="mg.example.com"></div>
        </fieldset>
        <button class="btn">Save System Settings</button>
      </div>
    </section>
  </main>
  <script>
    // Tab switching
    document.querySelectorAll('.tabs button').forEach(btn=>btn.addEventListener('click',()=>{
      document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
      document.getElementById(btn.dataset.tab).classList.add('active');
    }));
    // Mail service toggle
    const services = ['smtp','gmail','exchange','office365','sendgrid','mailgun'];
    document.getElementById('mailService').addEventListener('change', e => {
      services.forEach(s => document.getElementById(s+'Settings').classList.add('hidden'));
      document.getElementById(e.target.value+'Settings').classList.remove('hidden');
    });
  </script>
  <script src="js/app.js"></script>
  <script>
    initTheme();
    requireLogin();
    const role = localStorage.getItem('role');
    if (role === 'customer') {
      const nav = document.querySelector('nav.nav-links');
      if (nav) nav.innerHTML = '<a href="/Dashboard/customer_dashboard">Dashboard</a>';
      const sysTab = document.querySelector('[data-tab="system"]');
      const sysSection = document.getElementById('system');
      if (sysTab) sysTab.style.display = 'none';
      if (sysSection) sysSection.remove();
    }
    const emailField = document.getElementById('email');
    const nameField = document.getElementById('displayName');
    const passField = document.getElementById('password');
    const userEmail = localStorage.getItem('userEmail');
    emailField.value = userEmail || '';
    const account = userEmail && userEmail !== 'admin@corequeue.local' ? findAccount(userEmail) : null;
    if (account) {
      nameField.value = account.name || '';
    }
    document.querySelector('#profile .btn').addEventListener('click', () => {
      if (userEmail === 'admin@corequeue.local') {
        if (passField.value.trim()) {
          localStorage.setItem('adminPassword', passField.value.trim());
          if (typeof syncServerStorage === 'function') syncServerStorage();
          alert('Password updated');
        }
      } else if (account) {
        upsertAccount(userEmail, passField.value.trim() || null, nameField.value.trim());
        alert('Profile updated');
      }
    });
  </script>
</body>
</html>
