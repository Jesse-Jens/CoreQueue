<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory - CoreQueue</title>
  <style>
    :root {
      --bg: #1e1e2f;
      --bg-light: #2a2a3e;
      --text: #e0e0fa;
      --accent: #1E90FF;
      --accent-light: #4F8CFF;
      --danger: #FF4C4C;
      --warning: #FFC107;
    --success: #4CAF50;
    --info: #2196F3;
  }
  body.light {
    --bg: #f2f2f2;
    --bg-light: #fff;
    --text: #1e1e2f;
  }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
    body { display:flex; background:var(--bg); color:var(--text); min-height:100vh; }
    aside.sidebar {
      width:240px; background:var(--bg-light);
      display:flex; flex-direction:column; justify-content:space-between;
      padding:2rem 1rem;
    }
    aside.sidebar h2 {
      color:var(--accent); text-align:center; font-size:1.5rem;
      margin-bottom:2rem;
    }
    nav.nav-links a {
      display:block; color:var(--text); text-decoration:none; padding:0.75rem 1rem; margin-bottom:0.5rem; border-radius:4px; font-size:0.95rem; transition:background .2s;
    }
    nav.nav-links a.active, nav.nav-links a:hover { background:var(--accent); color:#fff; }
    .settings-group { border-top:1px solid var(--bg); padding-top:1rem; margin-top:1rem; }
    .settings-group a {
      display:block; color:var(--text); text-decoration:none;
      padding:.5rem 0; transition:color .2s;
    }
    .settings-group a:hover { color:var(--accent); }
    main.main { flex:1; padding:2rem; overflow-y:auto; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; }
    .header h1 { font-size:2rem; }
    .header-controls button {
      background:var(--accent); color:#fff; border:none;
      padding:.5rem 1rem; border-radius:4px; cursor:pointer;
      transition:background .2s; font-size:.9rem; margin-left:.5rem;
    }
    .header-controls button:hover { background:var(--accent-light); }
    .card {
      background:var(--bg-light); border-radius:8px;
      padding:1.5rem; box-shadow:0 4px 8px rgba(0,0,0,0.3);
      margin-bottom:2rem;
    }
    .card h2 { font-size:1.25rem; margin-bottom:1rem; }
    .form-grid {
      display:grid; grid-template-columns:1fr 1fr 1fr; gap:1rem;
      margin-bottom:1rem;
    }
    .form-grid .full { grid-column:1 / -1; }
    .form-group label { display:block; font-size:.9rem; margin-bottom:.25rem; }
    .form-group input, .form-group textarea {
      width:100%; padding:.5rem; background:var(--bg);
      border:1px solid var(--bg); border-radius:4px; color:var(--text);
    }
    .form-group textarea { min-height:4rem; resize:vertical; }
    .toggle-switch {
      position:relative; display:inline-block; width:40px; height:20px;
      margin-left:.5rem;
    }
    .toggle-switch input { opacity:0; width:0; height:0; }
    .slider {
      position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0;
      background-color:var(--bg); border:1px solid var(--bg);
      transition:.4s; border-radius:20px;
    }
    .slider::before {
      position:absolute; content:""; height:16px; width:16px;
      left:2px; bottom:2px; background-color:#fff;
      transition:.4s; border-radius:50%;
    }
    .toggle-switch input:checked + .slider { background-color:var(--accent); }
    .toggle-switch input:checked + .slider::before { transform:translateX(20px); }
    table { width:100%; border-collapse:collapse; }
    th, td {
      padding:.75rem; border-bottom:1px solid var(--bg);
      font-size:.9rem; text-align:left;
    }
    th { background:var(--bg); }
    td.actions { text-align:right; }
    .label-status {
      display:inline-block; padding:.2rem .6rem;
      border-radius:4px; font-size:.75rem;
      font-weight:500; color:#fff;
    }
    .status-out { background:var(--danger); }
    .status-low { background:var(--warning); }
    .status-in { background:var(--success); }
    .status-service { background:var(--info); }
    .btn-link {
      background:none; border:none; cursor:pointer;
      color:var(--accent-light); font-size:.9rem; margin-left:.5rem;
      transition:color .2s;
    }
    .btn-link:hover { color:#fff; }
    .btn-link.delete { color:var(--danger); }
    /* Verbeterde add knop */
    .btn-add {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: .75rem 1.5rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background .2s;
      font-size: 1rem;
      margin-top: .5rem;
    }
    .btn-add:hover { background: var(--accent-light); }
    @media(max-width:768px) {
      body { flex-direction:column; }
      aside.sidebar { width:100%; flex-direction:row; justify-content:space-around; padding:1rem; }
      main.main { padding:1rem; }
      .form-grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="top-nav">
      <h2>CoreQueue</h2>
      <nav class="nav-links">
        <a href="/Dashboard/dashboard">Dashboard</a>
        <a href="/inventory" class="active">Inventory</a>
        <a href="/Organisations/organisations">Organisations</a>
      </nav>
    </div>
    <div class="settings-group nav-links">
      <a href="/settings">Settings</a>
      <a href="#" onclick="signOut()">Sign Out</a>
    </div>
  </aside>

  <main class="main">
    <div class="header">
      <h1>Inventory Management</h1>
      <div class="header-controls">
        <button class="btn-toggle theme-toggle">🌙</button>
      </div>
    </div>

    <div class="card">
      <h2>Add New Inventory Item</h2>
      <div class="form-grid">
        <div class="form-group">
          <label for="item-name">Item Name *</label>
          <input type="text" id="item-name" placeholder="E.g. Router Cable">
        </div>
        <div class="form-group">
          <label for="part-number">Part Number *</label>
          <input type="text" id="part-number" placeholder="E.g. CAT6-10FT">
        </div>
        <div class="form-group">
          <label for="price">Price (€) *</label>
          <input type="number" id="price" value="0">
        </div>
        <div class="form-group">
          <label for="quantity">Stock Quantity *</label>
          <input type="number" id="quantity" value="0">
        </div>
        <div class="form-group full" style="display:flex; align-items:center;">
          <label for="unlimited">Unlimited Stock</label>
          <label class="toggle-switch">
            <input type="checkbox" id="unlimited">
            <span class="slider"></span>
          </label>
        </div>
        <div class="form-group full">
          <label for="description">Description</label>
          <textarea id="description" placeholder="Description, specs..."></textarea>
        </div>
      </div>
      <button class="btn-add">Add Inventory Item</button>
    </div>

    <div class="card">
      <h2>Inventory Items</h2>
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th>Part #</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Status</th>
            <th class="actions">Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Dynamische rows hier -->
        </tbody>
      </table>
    </div>
  </main>
  <script src="js/app.js"></script>
  <script>
    initTheme();
    requireLogin('technician');
  </script>
</body>
</html>
