<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Ticket View - CoreQueue</title>
  <style>
    :root {
      --bg: #1e1e2f;
      --bg-light: #2a2a3e;
      --text: #e0e0fa;
      --accent: #1E90FF;
      --danger: #FF4C4C;
      --success: #4CAF50;
      --await-customer: #FF9800;
      --await-technician: #00BCD4;
      --await-external: #9C27B0;
    }
    body.light {
      --bg: #f2f2f2;
      --bg-light: #fff;
      --text: #1e1e2f;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
    body { display:flex; background:var(--bg); color:var(--text); min-height:100vh; }
    aside.sidebar {
      width:240px; background:var(--bg-light);
      display:flex; flex-direction:column; justify-content:space-between;
      padding:1rem;
    }
    .top-nav h2 { color:var(--accent); font-size:1.25rem; text-align:center; margin-bottom:1rem; }
    nav.nav-links a {
      display:block; color:var(--text);
      text-decoration:none; padding:0.75rem 1rem;
      border-radius:4px; margin-bottom:0.5rem;
      font-size:0.95rem; transition:background .2s;
    }
    nav.nav-links a:hover { background:var(--accent); color:#fff; }
    .settings-group a {
      display:block; color:var(--text);
      text-decoration:none; padding:.5rem 1rem;
      font-size:.9rem; transition:color .2s;
    }
    .settings-group a:hover { color:var(--accent); }
    main.main { flex:1; padding:2rem; }
    .header {
      display:flex; align-items:center;
      justify-content:space-between; margin-bottom:1.5rem;
    }
    .header .back { color:var(--accent); text-decoration:none; font-size:.9rem; margin-right:1rem; background:none; border:none; cursor:pointer; }
    .header h1 { font-size:1.75rem; flex:1; }
    .header button.resolve-btn {
      background:var(--danger); color:#fff;
      border:none; padding:.5rem 1rem;
      border-radius:4px; cursor:pointer;
      font-size:.9rem;
    }
    .ticket-meta {
      background:var(--bg-light); padding:1rem;
      border-radius:6px; margin-bottom:1rem;
      display:grid; grid-template-columns:1fr 1fr; gap:1rem;
    }
    .ticket-meta p { font-size:.9rem; margin:.25rem 0; }
    .badge {
      padding:.2rem .6rem; border-radius:4px;
      font-size:.75rem; color:#fff; display:inline-block;
    }
    .status-open { background:var(--success); }
    .status-in-progress { background:var(--accent); }
    .status-awaiting-customer { background:var(--await-customer); }
    .status-awaiting-technician { background:var(--await-technician); }
    .status-awaiting-external-provider { background:var(--await-external); }
    .status-resolved { background:var(--danger); }
    .status-archived { background:#6c757d; }
    .problem-desc {
      background:var(--bg-light); padding:1rem;
      border-radius:6px; margin-bottom:1.5rem;
    }
    .problem-desc h2 { margin-bottom:.5rem; }
    .tabs {
      display:flex; border-bottom:1px solid var(--bg);
      margin-bottom:1rem;
    }
    .tabs button {
      background:none; border:none;
      padding:.75rem 1.5rem; cursor:pointer;
      color:var(--text); font-size:1rem;
      transition:color .2s;
    }
    .tabs button.active {
      color:#fff; border-bottom:3px solid var(--accent);
    }
    .section { display:none; }
    .section.active { display:block; }
    .list {
      background:var(--bg-light); padding:1rem;
      border-radius:6px; margin-top:1rem;
    }
    .list-item {
      padding:.75rem; border-bottom:1px solid var(--bg);
      display:flex; justify-content:space-between;
      align-items:center;
    }
    .list-item:last-child { border-bottom:none; }
    .note-technician{border-left:4px solid var(--warning);padding-left:.75rem;margin-bottom:.5rem;background:var(--bg-light);border-radius:4px;}
    .note-customer{border-left:4px solid var(--accent);padding-left:.75rem;margin-bottom:.5rem;background:var(--bg-light);border-radius:4px;}
    .file-item{padding:.75rem;display:flex;justify-content:space-between;align-items:flex-start;background:var(--bg-light);border-radius:6px;margin-bottom:.5rem;}
    .file-preview{width:40px;height:40px;object-fit:cover;border-radius:4px;margin-right:.75rem;}
    .file-actions{display:flex;gap:.5rem;margin-left:auto;}
    .btn-link{background:var(--accent);color:#fff;border:none;padding:.25rem .5rem;border-radius:4px;cursor:pointer;}
    .btn-link:hover{background:var(--accent-light);}
    textarea {
      width:100%; padding:.5rem;
      background:var(--bg-light); border:1px solid var(--bg);
      border-radius:4px; color:var(--text);
      font-size:1rem; resize:vertical;
      margin-top:1rem;
    }
    .btn {
      background:var(--accent); color:#fff;
      border:none; padding:.5rem 1rem;
      border-radius:4px; cursor:pointer;
      transition:background .2s; font-size:.95rem;
      margin-top:.75rem;
    }
    .btn:hover { background:#4F8CFF; }
    @media(max-width:768px) {
      body { flex-direction:column; }
      aside.sidebar { width:100%; flex-direction:row; justify-content:space-around; }
      main.main { padding:1rem; }
      .tabs { flex-wrap:wrap; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="top-nav">
      <h2>CoreQueue</h2>
      <nav class="nav-links">
        <a href="/Dashboard/customer_dashboard">Dashboard</a>
      </nav>
    </div>
    <div class="settings-group">
      <a href="/settings">Settings</a>
      <a href="#" onclick="signOut()">Sign Out</a>
    </div>
  </aside>
  <main class="main">
    <div class="header">
      <a href="/Dashboard/customer_dashboard" class="back">← Back</a>
      <button id="techBackBtn" class="back" style="display:none;margin-left:1rem;">← Back to Technician</button>
      <h1>Ticket #<span id="ticketCode"></span> - <span id="ticketTitle"></span></h1>
      <button class="resolve-btn">Mark Resolved</button>
    </div>
    <div class="ticket-meta">
      <p><strong>Organisation:</strong> <span id="metaOrg"></span></p>
      <p><strong>Contact:</strong> <span id="metaContact"></span></p>
      <p><strong>Technician:</strong> <span id="metaTech"></span></p>
      <p><strong>Status:</strong> <span class="badge" id="metaStatus"></span></p>
      <p><strong>Priority:</strong> <span class="badge" id="metaPriority"></span></p>
    </div>
    <div class="problem-desc">
      <h2>Problem Description</h2>
      <p id="problemDesc"></p>
    </div>
    <div class="tabs">
      <button class="active" data-target="updates">Updates</button>
      <button data-target="files">Files</button>
    </div>
    <div id="updates" class="section active">
      <div class="list" id="notesList"></div>
      <textarea rows="3" id="customerNote" placeholder="Schrijf uw opmerking..."></textarea>
      <button class="btn" id="addNoteBtn">Add Note</button>
    </div>
    <div id="files" class="section">
      <div class="list" id="filesList"></div>
    </div>
  </main>
  <script src="../../js/app.js"></script>
  <script>
    initTheme();
    requireLogin('customer');
    document.querySelectorAll('.tabs button').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tabs button').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(tab.dataset.target).classList.add('active');
      });
    });
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    let ticket = getTicket(id);
    if (ticket) {
      document.getElementById('ticketCode').textContent = id;
      document.getElementById('ticketTitle').textContent = ticket.title;
      document.getElementById('metaOrg').textContent = getOrganisation(ticket.organisation)?.name || ticket.organisation;
      document.getElementById('metaContact').textContent = ticket.contact;
      document.getElementById('metaTech').textContent = ticket.technician;
      const statusSpan = document.getElementById('metaStatus');
      statusSpan.textContent = ticket.status;
      statusSpan.className = `badge status-${ticket.status.toLowerCase().replace(/\s+/g,'-')}`;
      const priSpan = document.getElementById('metaPriority');
      priSpan.textContent = ticket.priority || '';
      if (ticket.priority) priSpan.classList.add(`priority-${ticket.priority.toLowerCase()}`);
      document.getElementById('problemDesc').textContent = ticket.description;
      renderNotes();
      renderFiles();
    }

    const backBtn = document.getElementById('techBackBtn');
    if (localStorage.getItem('role') === 'technician') {
      backBtn.style.display = 'inline-block';
      backBtn.addEventListener('click', () => {
        window.location.href = `/Dashboard/Tickets/ticket_view_technician?id=${id}`;
      });
    }

    document.querySelector('.resolve-btn').addEventListener('click', () => {
      updateTicket(id, { status: 'Resolved' });
      const statusSpan = document.getElementById('metaStatus');
      statusSpan.textContent = 'Resolved';
      statusSpan.className = 'badge status-resolved';
    });

    function renderNotes() {
      const list = document.getElementById('notesList');
      list.innerHTML = '';
      ticket.notes.filter(n => n.type !== 'internal' && !n.hidden).forEach(n => {
        const div = document.createElement('div');
        const cls = n.source === 'customer' ? 'note-customer' : 'note-technician';
        div.className = `list-item ${cls}`;
        div.innerHTML = `<p><strong>${n.author}:</strong> ${n.message}</p><span>${formatDate(n.time)}</span>`;
        list.appendChild(div);
      });
    }

    document.getElementById('addNoteBtn').addEventListener('click', () => {
      const msg = document.getElementById('customerNote').value.trim();
      if (!msg) return;
      const note = {
        type: 'external',
        message: msg,
        author: currentUserName(),
        timeSpent: 0,
        source: 'customer'
      };
      addNote(id, note);
      updateTicket(id, { status: 'Awaiting Technician' });
      ticket = getTicket(id);
      const statusSpan = document.getElementById('metaStatus');
      statusSpan.textContent = ticket.status;
      statusSpan.className = `badge status-${ticket.status.toLowerCase().replace(/\s+/g,'-')}`;
      document.getElementById('customerNote').value = '';
      renderNotes();
      renderFiles();
    });

    function renderFiles() {
      const list = document.getElementById('filesList');
      list.innerHTML = '';
      (ticket.files || []).forEach((f, idx) => {
        const div = document.createElement('div');
        div.className = 'file-item';
        let preview = '';
        if (f.data && f.data.startsWith('data:image')) {
          preview = `<img src="${f.data}" class="file-preview" data-index="${idx}">`;
        } else {
          preview = `<div class="file-preview" data-index="${idx}"></div>`;
        }
        div.innerHTML = `${preview}<span class="file-name" data-index="${idx}" style="cursor:pointer">${f.name}</span><div class="file-actions"><button class="btn-link download" data-index="${idx}">Download</button><button class="btn-link preview" data-index="${idx}">Preview</button></div>`;
        list.appendChild(div);
      });
      list.querySelectorAll('.file-name, .file-preview, .btn-link.preview').forEach(el => {
        el.addEventListener('click', () => {
          const idx = el.dataset.index;
          openPreview((ticket.files || [])[idx].data);
        });
      });
      list.querySelectorAll('.btn-link.download').forEach(btn => {
        btn.addEventListener('click', () => {
          const file = (ticket.files || [])[btn.dataset.index];
          const a = document.createElement('a');
          a.href = file.data;
          a.download = file.name;
          a.click();
        });
      });
    }

    const previewModal = document.createElement('div');
    previewModal.id = 'previewModal';
    previewModal.style.display = 'none';
    previewModal.innerHTML = `<div class="preview-content"><button id="closePreview" style="float:right">✕</button><iframe id="previewFrame" style="width:80vw;height:80vh;border:none;"></iframe></div>`;
    document.body.appendChild(previewModal);
    previewModal.addEventListener('click', e => {
      if (e.target.id === 'previewModal' || e.target.id === 'closePreview') previewModal.style.display = 'none';
    });
    function openPreview(src) {
      document.getElementById('previewFrame').src = src;
      previewModal.style.display = 'flex';
      previewModal.style.position = 'fixed';
      previewModal.style.top = 0;
      previewModal.style.left = 0;
      previewModal.style.width = '100%';
      previewModal.style.height = '100%';
      previewModal.style.background = 'rgba(0,0,0,0.8)';
      previewModal.style.alignItems = 'center';
      previewModal.style.justifyContent = 'center';
    }
  </script>
</body>
</html>
