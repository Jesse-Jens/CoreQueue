<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create New Ticket - CoreQueue</title>
  <style>
    :root {
      --bg: #1e1e2f;
      --bg-light: #2a2a3e;
      --text: #e0e0fa;
      --accent: #1E90FF;
      --accent-light: #4F8CFF;
      --input-bg: #2a2a3e;
      --input-border: #3a3a4e;
      --success: #4CAF50;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
    body { display:flex; background:var(--bg); color:var(--text); min-height:100vh; }
    aside.sidebar { width:240px; background:var(--bg-light); display:flex; flex-direction:column; justify-content:space-between; padding:2rem 1rem; }
    .top-nav { }
    .top-nav h2 { color:var(--accent); font-size:1.5rem; text-align:center; margin-bottom:2rem; }
    nav.nav-links a { display:block; color:var(--text); text-decoration:none; padding:.75rem 1rem; margin-bottom:.5rem; border-radius:4px; transition:background .2s; }
    nav.nav-links a:hover, nav.nav-links a.active { background:var(--accent); color:#fff; }
    .settings-group a { display:block; color:var(--text); text-decoration:none; padding:.5rem 0; transition:color .2s; }
    .settings-group a:hover { color:var(--accent); }
    main.main { flex:1; padding:2rem; }
    .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; }
    .header a.back { color:var(--accent-light); text-decoration:none; font-size:.9rem; margin-right:1rem; }
    .header h1 { font-size:2rem; flex:1; }
    .card { background:var(--bg-light); border-radius:8px; padding:1.5rem; box-shadow:0 4px 8px rgba(0,0,0,0.3); }
    .card h2 { font-size:1.25rem; margin-bottom:1rem; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    .form-group { display:flex; flex-direction:column; margin-bottom:1rem; }
    .form-group.full { grid-column:1 / -1; }
    .form-group label { font-size:.9rem; margin-bottom:.5rem; }
    .form-group input, .form-group select, .form-group textarea {
      padding:.5rem; background:var(--input-bg); border:1px solid var(--input-border); border-radius:4px; color:var(--text); font-size:1rem;
    }
    .form-group textarea { min-height:6rem; resize:vertical; }
    .form-group input[type=file] {
      display: none;
    }
    .file-upload-wrapper {
      position: relative;
      display: inline-block;
    }
    .file-upload-btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      padding: .5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background .2s;
      font-size: 1rem;
      border: none;
    }
    .file-upload-btn:hover { background: var(--accent-light); }
    .file-upload-label {
      margin-left: 1rem;
      font-size: .9rem;
      color: var(--text);
    }
    .file-upload-wrapper input[type=file]:focus + .file-upload-btn {
      outline: 2px solid var(--accent);
    }
    .btn-submit { grid-column:1 / -1; background:var(--success); color:#fff; border:none; padding:.75rem; border-radius:4px; cursor:pointer; font-size:1rem; transition:background .2s; }
    .btn-submit:hover { background:#42b35a; }
    @media(max-width:768px) { .form-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="top-nav">
      <h2>CoreQueue</h2>
      <nav class="nav-links">
        <a href="/Dashboard/Dashboard.html">Dashboard</a>
        <a href="/Inventory.html">Inventory</a>
        <a href="/Organisations/Organisations.html">Organisations</a>
      </nav>
    </div>
    <div class="settings-group">
      <a href="/settings.html">Settings</a>
      <a href="#" onclick="signOut()">Sign Out</a>
    </div>
  </aside>
  <main class="main">
    <div class="header">
      <a href="/Dashboard/Dashboard.html" class="back">← Back</a>
      <h1>Create New Ticket</h1>
    </div>
    <div class="card">
      <h2>Ticket Details</h2>
      <form class="form-grid">
        <div class="form-group full">
          <label for="title">Title</label>
          <input type="text" id="title" placeholder="Short summary of issue">
        </div>
        <div class="form-group">
          <label for="organisation">Organisation</label>
          <select id="organisation">
            <option>Select organisation…</option>
          </select>
        </div>
        <div class="form-group">
          <label for="contact">Contact Person</label>
          <select id="contact">
            <option>Select contact…</option>
          </select>
        </div>
        <div class="form-group">
          <label for="technician">Assign Technician (optional)</label>
          <select id="technician">
            <option>Unassigned</option>
          </select>
        </div>
        <div class="form-group">
          <label for="priority">Priority</label>
          <select id="priority">
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
            <option>Critical</option>
          </select>
        </div>
        <div class="form-group full">
          <label for="description">Problem Description</label>
          <textarea id="description" placeholder="Describe the issue in detail…"></textarea>
        </div>
        <div class="form-group full">
          <label for="attachment">Upload Files (optional)</label>
          <div class="file-upload-wrapper">
            <input type="file" id="attachment" multiple>
            <button type="button" class="file-upload-btn">Upload Files</button>
            <span class="file-upload-label" id="file-upload-label">No files chosen</span>
          </div>
        </div>
        <button type="submit" class="btn-submit">Submit Ticket</button>
      </form>
    </div>
  </main>
  <script src="../../js/app.js"></script>
  <script>
    requireLogin('technician');
  </script>
</body>
</html>
