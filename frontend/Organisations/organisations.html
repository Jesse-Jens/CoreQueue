<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organisations - CoreQueue</title>
  <style>
    :root {
      --bg: #1e1e2f;
      --bg-light: #2a2a3e;
      --text: #e0e0fa;
      --accent: #1E90FF;
      --accent-light: #4F8CFF;
      --danger: #FF4C4C;
      --warning: #FFC107;
    --success: #4CAF50;
    --info: #2196F3;
  }
  body.light {
    --bg: #f2f2f2;
    --bg-light: #fff;
    --text: #1e1e2f;
  }
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }
    body {
      display: flex;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    /* Sidebar */
    aside.sidebar {
      width: 240px;
      background: var(--bg-light);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2rem 1rem;
    }
    aside.sidebar h2 {
      color: var(--accent);
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 2rem;
    }
    nav.nav-links a {
      display:block; color: var(--text); text-decoration:none; padding:0.75rem 1rem; margin-bottom:0.5rem; border-radius:4px; font-size:0.95rem; transition: background .2s;
    }
    nav.nav-links a:hover,
    nav.nav-links a.active {
      background: var(--accent);
      color: #fff;
    }
    .settings-group {
      border-top: 1px solid var(--bg);
      padding-top: 1rem;
      margin-top: 1rem;
    }
    .settings-group a {
      display: block;
      color: var(--text);
      text-decoration: none;
      padding: .5rem 0;
      transition: color .2s;
    }
    .settings-group a:hover {
      color: var(--accent);
    }
    /* Main content */
    main.main {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .header h1 {
      font-size: 2rem;
    }
    .header-controls {
      display: flex;
      gap: .5rem;
    }
    .header-controls button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: .5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background .2s;
      font-size: .9rem;
    }
    .header-controls button:hover {
      background: var(--accent-light);
    }
    .card {
      background: var(--bg-light);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      margin-bottom: 2rem;
    }
    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
    }
    .search-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .search-bar input {
      flex: 1;
      padding: .5rem 1rem;
      border-radius: 4px;
      border: 1px solid var(--bg);
      background: var(--bg);
      color: var(--text);
    }
    .search-bar button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: .5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background .2s;
    }
    .search-bar button:hover {
      background: var(--accent-light);
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: .75rem;
      border-bottom: 1px solid var(--bg);
      font-size: .9rem;
      text-align: left;
    }
    th {
      background: var(--bg);
    }
    td.actions {
      text-align: right;
    }
    .btn-link {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--accent-light);
      font-size: .9rem;
      margin-left: .5rem;
      transition: color .2s;
    }
    .btn-link:hover {
      color: #fff;
    }
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      aside.sidebar {
        width: 100%;
        flex-direction: row;
        justify-content: space-around;
        padding: 1rem;
      }
      main.main {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="top-nav">
      <h2>CoreQueue</h2>
      <nav class="nav-links">
        <a href="/Dashboard/dashboard">Dashboard</a>
        <a href="/inventory">Inventory</a>
        <a href="/Organisations/organisations" class="active">Organisations</a>
      </nav>
    </div>
    <div class="settings-group">
      <a href="/settings">Settings</a>
      <a href="#" onclick="signOut()">Sign Out</a>
    </div>
  </aside>

  <main class="main">
    <div class="header">
      <h1>Organisations</h1>
      <div class="header-controls">
        <button class="btn-toggle theme-toggle">🌙</button>
        <button class="btn-archived">Show Archived</button>
        <button class="btn-add">+ Add Organisation</button>
      </div>
    </div>

    <div class="card">
      <div class="search-bar">
        <input type="text" placeholder="Search organisations…">
        <button>Search</button>
      </div>
      <table id="activeTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Contact</th>
            <th>Email</th>
            <th>Phone</th>
            <th class="actions">Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="card" id="archivedCard" style="display:none;">
      <h2>Archived Organisations</h2>
      <table id="archivedTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Contact</th>
            <th>Email</th>
            <th>Phone</th>
            <th class="actions">Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
  <script src="../js/app.js"></script>
  <script>
    initTheme();
    requireLogin('technician');
    document.querySelector('.btn-add').addEventListener('click', () => {
      window.location.href = '/Organisations/new_organisation';
    });
    document.querySelector('.btn-archived').addEventListener('click', () => {
      const card = document.getElementById('archivedCard');
      const isHidden = card.style.display === 'none';
      card.style.display = isHidden ? 'block' : 'none';
      document.querySelector('.btn-archived').textContent = isHidden ? 'Hide Archived' : 'Show Archived';
      if (isHidden) renderArchived();
    });

    function renderActive() {
      const tbody = document.querySelector('#activeTable tbody');
      tbody.innerHTML = '';
      const orgs = getOrganisations()
        .filter(o => !o.archived)
        .sort((a, b) => a.name.localeCompare(b.name));
      orgs.forEach(o => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${o.name}</td>
          <td>${(o.contacts[0] && o.contacts[0].name) || ''}</td>
          <td>${o.email || ''}</td>
          <td>${o.phone || ''}</td>
          <td class="actions">
            <button class="btn-link" onclick="window.location.href='/Organisations/single_organisation?id=${o.id}'">View</button>
          </td>`;
        tbody.appendChild(tr);
      });
    }

    function renderArchived() {
      const tbody = document.querySelector('#archivedTable tbody');
      tbody.innerHTML = '';
      const orgs = getOrganisations()
        .filter(o => o.archived)
        .sort((a, b) => a.name.localeCompare(b.name));
      orgs.forEach(o => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${o.name}</td>
          <td>${(o.contacts[0] && o.contacts[0].name) || ''}</td>
          <td>${o.email || ''}</td>
          <td>${o.phone || ''}</td>
          <td class="actions">
            <button class="btn-link" onclick="window.location.href='/Organisations/single_organisation?id=${o.id}'">View</button>
          </td>`;
        tbody.appendChild(tr);
      });
    }

    renderActive();
  </script>
</body>
</html>
