<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Organisation - CoreQueue</title>
  <style>
    :root {
      --bg: #1e1e2f;
      --bg-light: #2a2a3e;
      --text: #e0e0fa;
      --accent: #1E90FF;
      --accent-light: #4F8CFF;
      --input-bg: #2a2a3e;
      --input-border: #3a3a4e;
      --success: #4CAF50;
    }
    body.light {
      --bg: #f2f2f2;
      --bg-light: #fff;
      --text: #1e1e2f;
      --input-bg: #fff;
      --input-border: #ccc;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
    body{display:flex;background:var(--bg);color:var(--text);min-height:100vh;}
    aside.sidebar{width:240px;background:var(--bg-light);display:flex;flex-direction:column;justify-content:space-between;padding:2rem 1rem;}
    aside.sidebar h2{color:var(--accent);font-size:1.5rem;text-align:center;margin-bottom:2rem;}
    nav.nav-links a{display:block;color:var(--text);text-decoration:none;padding:0.75rem 1rem;margin-bottom:0.5rem;border-radius:4px;font-size:0.95rem;transition:background .2s;}
    nav.nav-links a:hover,nav.nav-links a.active{background:var(--accent);color:#fff;}
    .settings-group{border-top:1px solid var(--bg);padding-top:1rem;margin-top:1rem;}
    .settings-group a{display:block;color:var(--text);text-decoration:none;padding:.5rem 0;transition:color .2s;}
    .settings-group a:hover{color:var(--accent);}
    main.main{flex:1;padding:2rem;}
    .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;}
    .header a.back{color:var(--accent-light);text-decoration:none;font-size:.9rem;margin-right:1rem;}
    .header h1{font-size:2rem;flex:1;}
    .card{background:var(--bg-light);border-radius:8px;padding:1.5rem;box-shadow:0 4px 8px rgba(0,0,0,0.3);}
    .card h2{font-size:1.25rem;margin-bottom:1rem;}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
    .form-group{display:flex;flex-direction:column;margin-bottom:1rem;}
    .form-group.full{grid-column:1 / -1;}
    .form-group label{font-size:.9rem;margin-bottom:.5rem;}
    .form-group input,.form-group textarea{padding:.5rem;background:var(--input-bg);border:1px solid var(--input-border);border-radius:4px;color:var(--text);font-size:1rem;}
    .form-group textarea{min-height:6rem;resize:vertical;}
    .btn-submit{grid-column:1 / -1;background:var(--success);color:#fff;border:none;padding:.75rem;border-radius:4px;cursor:pointer;font-size:1rem;transition:background .2s;}
    .btn-submit:hover{background:#42b35a;}
    @media(max-width:768px){.form-grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="top-nav">
      <h2>CoreQueue</h2>
      <nav class="nav-links">
        <a href="/Dashboard/dashboard">Dashboard</a>
        <a href="/inventory">Inventory</a>
        <a href="/Organisations/organisations" class="active">Organisations</a>
      </nav>
    </div>
    <div class="settings-group">
      <a href="/settings">Settings</a>
      <a href="#" onclick="signOut()">Sign Out</a>
    </div>
  </aside>
  <main class="main">
    <div class="header">
      <a href="/Organisations/organisations" class="back">← Back</a>
      <h1>Create Organisation</h1>
      <button class="theme-toggle">🌙</button>
    </div>
    <div class="card">
      <h2>Organisation Details</h2>
      <form class="form-grid" id="orgForm">
        <div class="form-group full">
          <label for="name">Organisation Name</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-group">
          <label for="address">Address</label>
          <input type="text" id="address">
        </div>
        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email">
        </div>
        <div class="form-group full">
          <label for="note">Additional Info</label>
          <textarea id="note"></textarea>
        </div>
        <div class="form-group">
          <label for="contact">Contact Person</label>
          <input type="text" id="contact" required>
        </div>
        <div class="form-group">
          <label for="contactEmail">Contact Email</label>
          <input type="email" id="contactEmail">
        </div>
        <div class="form-group">
          <label for="contactPhone">Contact Phone</label>
          <input type="tel" id="contactPhone">
        </div>
        <button type="submit" class="btn-submit">Create Organisation</button>
      </form>
    </div>
  </main>
  <script src="../js/app.js"></script>
  <script>
    initTheme();
    requireLogin('technician');
    document.getElementById('orgForm').addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const contactName = document.getElementById('contact').value.trim();
      if (!name || !contactName) return;
      const id = createOrganisation({
        name,
        address: document.getElementById('address').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        email: document.getElementById('email').value.trim(),
        note: document.getElementById('note').value.trim()
      }, {
        name: contactName,
        email: document.getElementById('contactEmail').value.trim(),
        phone: document.getElementById('contactPhone').value.trim(),
        note: '',
        role: 'controller'
      });
      const pass = upsertAccount(document.getElementById('contactEmail').value.trim(), null, contactName, id, 'controller');
      alert(`Invite password for ${document.getElementById('contactEmail').value.trim()}: ${pass}`);
      window.location.href = `/Organisations/single_organisation?id=${id}`;
    });
  </script>
</body>
</html>
